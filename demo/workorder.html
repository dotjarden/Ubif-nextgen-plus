<header><strong>ubreakifix <span style="color:#8224cf">nextgen +</span></strong><span class="muted">Extension preview · fictional data</span></header>
<main><h1><span data-aui="text">Work order #500089742 | Alex Morgan</span></h1>
<div class="card"><p data-aui="text">Samsung Galaxy S21 5G Phantom Gray (none)</p><div class="details"><p class="text muted">IMEI: 350166280848735</p><p class="muted">Ready for work</p></div></div>
<div class="card"><p class="muted">Notes</p><div class="note-field"><label for="note">Add a note</label><textarea id="note" data-testid="notes-input" rows="4" maxlength="2000" style="display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #cec8d3;border-radius:8px;font:inherit"></textarea></div><p>Alex created a GSPN ticket. Ticket no. 4184243168</p></div></main>
<script>
const saved = JSON.parse(localStorage.getItem('demo-samsung') || '{}');
const sent = [];
window.chrome = {
  runtime: { sendMessage: async message => { sent.push(message); console.info('[preview] would open Sprinklr with', message); return { ok: true }; } },
  storage: { local: { get: async key => (key in saved ? { [key]: saved[key] } : {}), set: async v => { Object.assign(saved, v); localStorage.setItem('demo-samsung', JSON.stringify(saved)); } }, onChanged: { addListener() {} } }
};
window.__samsungSent = sent;
const workorder = { workorderId: 500089742, CustomerDevice: { customerId: 77, imei: '350166280848735', DeviceCatalog: { name: 'Samsung Galaxy S21 5G Phantom Gray (none)' } },
  PartnerJob: { partnerJobId: 9, PartnerJobAttributes: [{ partnerJobAttributeTypeId: 53, value: '4184243168' }] } };
const realFetch = window.fetch.bind(window);
window.fetch = (url, options) => String(url).startsWith('/api/workorder/') ? Promise.resolve({ ok: true, json: async () => ({ workorder }) }) : realFetch(url, options);
addEventListener('message', e => { if (e.data?.type === 'message-context-request') postMessage({ source: 'ubif-plus', type: 'tech-context', email: 'alex.tech@ubreakifix.com', name: 'Alex Tech', storeId: '12', storeName: 'Manchester CT #878' }, '*'); });
</script>
